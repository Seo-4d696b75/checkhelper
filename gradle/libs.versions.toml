[versions]
kotlin = "2.3.0"
android-gradle = "8.13.2"
ktlint-gradle = "12.1.0"
hilt = "2.57.2"
navigation = "2.9.6"
room = "2.8.4"
androidx-core = "1.17.0"
androidx-lifecycle = "2.10.0"
androidx-test = "1.4.0"
kotlinx-coroutine = "1.10.2"
kotlinx-serialization = "1.9.0"
retrofit = "3.0.0"
okhttp = "5.3.2"
espresso-core = "3.6.1"
firebase = "34.7.0"
compose = "2025.12.01"

[plugins]
# kotlin
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.4" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }

# android
android-application = { id = "com.android.application", version.ref = "android-gradle" }
android-libraly = { id = "com.android.library", version.ref = "android-gradle" }

# compose
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# ktlint
ktlint-gradle = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }

# hilt
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
hilt-core = { id = "com.google.dagger.hilt.core", version.ref = "hilt" }

# navigation safe-args
androidx-navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }

# gms
google-services = { id = "com.google.gms.google-services", version = "4.4.4" }

# firebase
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.6" }

[libraries]
# metadata
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }

# coroutine
kotlinx-coroutines-bom = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-bom", version.ref = "kotlinx-coroutine" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android" }

# serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version = "0.4.0" }

# android
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.1" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.12.2" }
androidx-splash = { group = "androidx.core", name = "core-splashscreen", version = "1.2.0" }

# compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-icon = { group = "androidx.compose.material", name = "material-icons-core" }

valentinilk-shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version = "1.3.3" }
compose-material3-picker = { group = "com.seo4d696b75.compose", name = "material3-picker", version = "0.2.0" }

# navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.3.0" }
androidx-navigation-runtime = { group = "androidx.navigation", name = "navigation-runtime-ktx", version.ref = "navigation" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# lifecycle
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# hilt
hilt-core = { group = "com.google.dagger", name = "hilt-core", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# room
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# datastore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.2.0" }

# material
google-material = { group = "com.google.android.material", name = "material", version = "1.13.0" }

# google play service
google-play-services-location = { group = "com.google.android.gms", name = "play-services-location", version = "21.3.0" }

# firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

# retrofit
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logger = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# math
apache-math = { group = "org.apache.commons", name = "commons-math3", version = "3.6.1" }

# logger
timber = { group = "com.jakewharton.timber", name = "timber", version = "5.0.1" }

# map (GeoJSON)
google-maps-utils = { group = "com.google.maps.android", name = "maps-utils-ktx", version = "5.2.2" }
google-android-maps-utils = { group = "com.google.maps.android", name = "android-maps-utils", version = "3.20.1" }

# diagram
diagram = { group = "com.github.seo4d696b75", name = "diagram", version = "0.2.2" }

# test
junit = { group = "junit", name = "junit", version = "4.13.2" }
google-truth = { group = "com.google.truth", name = "truth", version = "1.4.4" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidx-test" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
robolectric = { group = "org.robolectric", name = "robolectric", version = "4.13" }
mockk = { group = "io.mockk", name = "mockk", version = "1.13.12" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
